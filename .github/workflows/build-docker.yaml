name: Build and Publish Image to Docker Hub

on:
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build ./Assignment1/django -t nygma13/assignment1-exerc3:latest
      - name: Push image to Docker Hub
        run: |
          docker login -u nygma13 -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker push nygma13/assignment1-exerc3:latest