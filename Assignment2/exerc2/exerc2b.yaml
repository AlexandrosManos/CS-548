apiVersion: v1
kind: ConfigMap
metadata:
  name: wget-conf
data:
  run.sh: |
    #!/bin/bash
    apt-get update && apt-get install -y wget
    wget -E -k -p https://www.csd.uoc.gr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: con1
            image: ubuntu:24.04
            command: ["/bin/bash", "/mnt/run.sh"]
            volumeMounts:
            - name: v-conf
              mountPath: /mnt
            - name: v-data
              mountPath: /CronJobData
          volumes:
          - name: v-conf
            configMap:
              name: conf
          - name: v-data
            persistentVolumeClaim:
              claimName: pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: p1
spec:
  containers:
  - name: nginx
    image: nginx:1.29.5-alpine
    volumeMounts:
    - name: v-data
      mountPath: /usr/share/nginx/html
  volumes:
  - name: v-data
    persistentVolumeClaim:
      claimName: pvc